[platformio]
src_dir = main

[env:esp32-s3-n16r8]
platform = espressif32@6.13.0
board = esp32-s3-n16r8
framework = espidf
build_type = release
monitor_speed = 115200
board_build.partitions = partitions.csv
upload_speed = 921600

[env:esp32-s3-n16r8-16mb]
platform = espressif32@6.13.0
board = esp32-s3-n16r8-16mb
framework = espidf
build_type = release
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.16mb"
upload_speed = 921600
